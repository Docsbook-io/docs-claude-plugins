name: CI

# This repository had no CI at all. `claude plugin validate` was already able to
# catch the version drift between marketplace.json and plugin.json that sat here
# unnoticed — there was simply nothing running it.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The gate that makes a stale skills catalog impossible to merge: re-run
      # the sync against the pinned upstream and fail if the committed tree
      # differs by a byte. A bot PR would only be a notification; this is a wall.
      #
      # It is only half the guarantee, though — a pin nobody advances matches
      # itself forever, which is how this repo shipped a 52-skill catalog for
      # eleven days after upstream replaced it with 4. The other half is
      # .github/workflows/sync-upstream.yml, which moves the pin hourly.
      - name: Skills match the pinned docs-skills commit
        run: node scripts/sync-skills.mjs --check

      # Versions, MCP tool names and namespaces, command/skill collisions,
      # metric_dictionary paths, and every skill or reference file a command
      # names. See the header of the script for why each check exists — every
      # one of them was a real defect in this repo.
      #
      # scripts/mcp-tools.json is deliberately NOT re-fetched here: that check
      # needs a live call to docsbook.io, and a deploy in progress would turn
      # every open pull request red for a reason that has nothing to do with the
      # pull request. It runs in the scheduled sync instead, where a stale list
      # is a commit and an outage is a retry an hour later.
      - name: Plugin guardrails
        run: node scripts/check-plugin.mjs
